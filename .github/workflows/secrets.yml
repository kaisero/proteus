name: Secrets

# Secret scanning. A fetched configuration holds addresses and secrets, so a scan
# of every commit backs up .gitignore. fetch-depth: 0 checks out the full history,
# so the scan covers every commit of the branch or pull request.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists the commits of a pull request through the API; without
  # this it fails with "Resource not accessible by integration".
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal repository needs no GITLEAKS_LICENSE; an organization does.
