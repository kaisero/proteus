name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # A new vulnerability in a dependency shows up without a push.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Fails if go.mod/go.sum drifted from the source (a plain build would
      # silently tidy first and mask it).
      - name: Modules tidy
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.13.1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Test (race)
        run: go test -race -coverprofile=coverage.out ./...
      # The gate re-runs the tests without -race, so its percentages come from
      # the same command a developer runs locally.
      - name: Coverage floors
        run: make test-cov
      # Every benchmark runs once: a documented figure stays backed by one
      # that still compiles and runs (AGENTS.md R7).
      - name: Benchmarks run
        run: make bench-check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Prove the release target (static linux/amd64) compiles.
      - name: Build
        run: make build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The agent docs quote the real API; a block that drifted fails here.
      - name: Agent context matches the code
        run: make context-check
      # The version is pinned in the Makefile, so CI and a local run scan alike.
      - name: Vulnerability scan
        run: make vuln-tool vuln
