name: Release

# A pull request to main is a release candidate. It runs the check and the build,
# so a missing CHANGELOG section, a version that is already released, or a broken
# cross-build fails before the merge. The merge to main then publishes: it tags
# v<VERSION>, attaches the archives and SHA256SUMS, and takes the release notes
# from the CHANGELOG section of that version.
#
# To release: set VERSION, add a "## [<version>]" section to CHANGELOG.md, and
# open a pull request from develop to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the version, check the release, extract the notes
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION '$VERSION' is not a semantic version such as 0.0.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "$EVENT" = pull_request ]; then
              echo "::error::v$VERSION is already released. Raise VERSION and add its CHANGELOG section."
              exit 1
            fi
            echo "v$VERSION is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v ver="$VERSION" '/^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } } found { print }' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]'. Add the release notes first."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Release candidate v$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gate.outputs.release == 'true'
        with:
          name: release-notes
          path: notes.md

  build:
    name: Build archives
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build the archives for every platform
        run: make release-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish the GitHub release
    needs: [check, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the tag and the release
      id-token: write      # sign the build provenance
      attestations: write  # store the build provenance
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: .
      # Anyone can check an archive with: gh attestation verify <file> -R <owner>/<repo>
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the tag and the release
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          # A suffix such as 0.1.0-rc.1 marks a prerelease.
          if [[ "$VERSION" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            "${FLAGS[@]}" \
            dist/*
