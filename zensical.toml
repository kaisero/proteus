[project]
site_name = "proteus"
site_description = "Answer questions about PAN-OS firewalls from their configuration and operational state."
site_url = "https://kaisero.github.io/proteus/"
repo_url = "https://github.com/kaisero/proteus"
repo_name = "kaisero/proteus"
copyright = "Copyright &copy; 2026 Oliver Kaiser"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "Search" = "guides/search.md" },
    { "Lookup" = "guides/lookup.md" },
    { "Simulate policy" = "guides/simulate-policy.md" },
    { "Simulate NAT" = "guides/simulate-nat.md" },
    { "Simulate routing" = "guides/simulate-routing.md" },
    { "Snapshots" = "guides/snapshots.md" },
    { "Scripting" = "guides/scripting.md" },
    { "MCP server" = "guides/mcp.md" },
  ] },
  { "Configuration" = "configuration.md" },
  { "CLI reference" = "cli-reference.md" },
  { "Limits" = "limits.md" },
  { "Development" = "development.md" },
  { "Concepts" = [
    { "How proteus works" = "concepts/index.md" },
    { "Snapshots and the store" = "concepts/snapshots.md" },
    { "Scope" = "concepts/scope.md" },
    { "Fidelity" = "concepts/fidelity.md" },
    { "Architecture" = "concepts/architecture.md" },
  ] },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Working notes kept in docs/ but not part of the published site. Lab notes hold
# device data, so a page under docs/ is published unless a pattern here names it.
[project.plugins.exclude]
glob = [
  "specs/*",
  "plans/*",
  "lab/*",
  "todo.md",
  "zone-snapshot-format.md",
]

[project.markdown_extensions]
admonition = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
toc.permalink = true
