# golangci-lint v2 configuration for proteus.
# Run: make lint   (or: golangci-lint run)
version: "2"

run:
  timeout: 5m

linters:
  # Keep the standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # and add a curated strict set on top.
  enable:
    - gosec
    - revive
    - gocritic
    - misspell
    - bodyclose
    - unconvert
    - unparam
    - errorlint
    - paralleltest
    - tparallel
  settings:
    errcheck:
      # Writes to an in-memory buffer or to stdout cannot be usefully handled.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - (*bytes.Buffer).WriteString
    gosec:
      excludes:
        - G304 # file path from a variable — the whole library reads schema and config paths the caller supplies
    misspell:
      ignore-rules:
        - statuser # an answer that sets its own status (Stringer-style naming), not a typo
  exclusions:
    generated: lax
    rules:
      # Tests craft malformed schema and config fragments on purpose.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
      # contract_test.go's row/format subtests share one row's "outputs" map and
      # "want" exit code, read back once every format has run; running them in
      # parallel would race on that map, so they stay sequential on purpose.
      - path: internal/cli/contract_test\.go
        linters:
          - paralleltest
          - tparallel

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/okaiser/proteus
