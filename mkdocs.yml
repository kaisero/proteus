site_name: proteus
site_description: Answer questions about PAN-OS firewalls from their configuration and operational state.
copyright: Copyright &copy; 2026 Oliver Kaiser

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Search: guides/search.md
      - Lookup: guides/lookup.md
      - Simulate policy: guides/simulate-policy.md
      - Simulate NAT: guides/simulate-nat.md
      - Simulate routing: guides/simulate-routing.md
      - Snapshots: guides/snapshots.md
      - Scripting: guides/scripting.md
  - Configuration: configuration.md
  - CLI reference: cli-reference.md
  - Architecture: architecture.md
  - Limits: limits.md
  - Development: development.md

# Working notes kept in docs/ but not part of the published site.
exclude_docs: |
  specs/
  plans/
  lab/
  todo.md
  zone-snapshot-format.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
